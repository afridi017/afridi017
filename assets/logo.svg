<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2FF7">
        <animate attributeName="stop-color" values="#7B2FF7;#22D3EE;#7B2FF7" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#7B2FF7;#22D3EE" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .border-glow {
        animation: pulse 2.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { stroke-opacity: 0.4; stroke-width: 1.5; }
        50% { stroke-opacity: 1; stroke-width: 2.5; }
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .subtitle {
        font-family: 'Courier New', monospace;
        fill: #8b949e;
      }
      .main-text {
        font-family: 'Arial Black', sans-serif;
        font-weight: 900;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="896" height="216" rx="16" fill="#0B0F19"/>

  <!-- Grid pattern background -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a1f2e" stroke-width="1"/>
  </pattern>
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#grid)"/>

  <!-- Glowing border -->
  <rect class="border-glow" x="2" y="2" width="896" height="216" rx="16" fill="none" stroke="#7B2FF7" stroke-width="2"/>

  <!-- Main Logo Text -->
  <text x="450" y="115" text-anchor="middle" class="main-text" font-size="64" fill="url(#neonGrad)" filter="url(#glow)">
    IB AFRIDI
  </text>

  <!-- Subtitle -->
  <text x="450" y="155" text-anchor="middle" class="subtitle" font-size="18">
    root@kali:~# cybersecurity --mode=ethical --status=active<tspan class="cursor">_</tspan>
  </text>

  <!-- Tagline -->
  <text x="450" y="185" text-anchor="middle" class="subtitle" font-size="14" fill="#7B2FF7">
    Pentest Framework Developer · 3D Web Explorer · Peshawar, Pakistan 🇵🇰
  </text>
</svg>
