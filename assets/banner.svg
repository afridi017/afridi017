<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#151a2e"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2FF7"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes fadeGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      .float-shape { animation: float 3s ease-in-out infinite; }
      .glow-dot { animation: fadeGlow 2s ease-in-out infinite; }
      .mono { font-family: 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Grid -->
  <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2338" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="300" fill="url(#bgGrid)"/>

  <!-- Floating neon dots (decoration) -->
  <circle class="glow-dot" cx="80" cy="60" r="4" fill="#22D3EE"/>
  <circle class="glow-dot" cx="1120" cy="80" r="5" fill="#7B2FF7"/>
  <circle class="glow-dot" cx="150" cy="240" r="3" fill="#7B2FF7"/>
  <circle class="glow-dot" cx="1050" cy="230" r="4" fill="#22D3EE"/>

  <!-- Terminal window mockup (left side) -->
  <g class="float-shape" transform="translate(60,90)">
    <rect width="260" height="140" rx="10" fill="#11151f" stroke="#7B2FF7" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="20" r="6" fill="#27c93f"/>
    <text x="20" y="50" class="mono" font-size="11" fill="#22D3EE">$ nmap -sV target.com</text>
    <text x="20" y="70" class="mono" font-size="11" fill="#8b949e">[+] Scanning ports...</text>
    <text x="20" y="90" class="mono" font-size="11" fill="#8b949e">[+] 22 open  ssh</text>
    <text x="20" y="110" class="mono" font-size="11" fill="#27c93f">[✓] Recon complete</text>
  </g>

  <!-- Main Title (center-right) -->
  <text x="750" y="130" text-anchor="middle" font-family="Arial Black" font-weight="900" font-size="56" fill="url(#textGrad)" filter="url(#glowBig)">
    IB AFRIDI
  </text>
  <text x="750" y="170" text-anchor="middle" class="mono" font-size="18" fill="#D8D8D8">
    Cybersecurity Enthusiast &amp; Tool Developer
  </text>
  <text x="750" y="200" text-anchor="middle" class="mono" font-size="14" fill="#7B2FF7">
    "Ethical hacking is not a crime, it's a skill."
  </text>
</svg>
