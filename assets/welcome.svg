<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%">
  <defs>
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2FF7">
        <animate attributeName="stop-color" values="#7B2FF7;#22D3EE;#7B2FF7" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#7B2FF7;#22D3EE" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="typeClip">
      <rect x="440" y="78" height="34" width="0">
        <animate attributeName="width" from="0" to="330" dur="2.2s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b2b" stroke-width="1"/>
    </pattern>

    <style>
      .mono { font-family: 'Courier New', monospace; }
      .big  { font-family: 'Arial Black', Arial, sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="#0B0F19"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Pulsing border -->
  <rect x="2" y="2" width="1196" height="316" rx="14" fill="none" stroke="#7B2FF7" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Scan line -->
  <rect x="0" y="30" width="1200" height="70" fill="url(#scanGrad)">
    <animate attributeName="y" values="20;230;20" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corner brackets -->
  <g stroke="#22D3EE" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 30 50 L 30 26 L 54 26"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></path>
    <path d="M 1170 50 L 1170 26 L 1146 26"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></path>
    <path d="M 30 270 L 30 294 L 54 294"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></path>
    <path d="M 1170 270 L 1170 294 L 1146 294"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></path>
  </g>

  <!-- Floating dots -->
  <circle cx="140" cy="90" r="4" fill="#22D3EE"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1060" cy="110" r="5" fill="#7B2FF7"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="250" r="3" fill="#7B2FF7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="240" r="4" fill="#22D3EE"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>

  <!-- Typing: ssh connect line -->
  <g clip-path="url(#typeClip)">
    <text x="440" y="100" class="mono" font-size="18" fill="#27c93f">$ ssh visitor@ib-afridi.profile</text>
  </g>
  <rect x="775" y="86" width="10" height="16" fill="#27c93f">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Main WELCOME -->
  <text x="600" y="185" text-anchor="middle" class="big" font-size="78" fill="url(#wGrad)" filter="url(#glow)" letter-spacing="6">
    WELCOME
  </text>

  <!-- Subtitle -->
  <text x="600" y="222" text-anchor="middle" class="mono" font-size="17" fill="#8b949e">
    Assalam-o-Alaikum, Visitor — Scanning profile... 100% Loaded
  </text>

  <!-- ACCESS GRANTED badge -->
  <g>
    <rect x="505" y="248" width="190" height="34" rx="17" fill="none" stroke="#27c93f" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="270" text-anchor="middle" class="mono" font-size="14" fill="#27c93f">✓ ACCESS GRANTED</text>
  </g>
</svg>
