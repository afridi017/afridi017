name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Slow down snake animation
        run: |
          python3 - <<'EOF'
          import re, glob
          FACTOR = 2.0   # 2.0 = half speed | 3.0 = aur slow | 1.5 = thoda slow
          for path in glob.glob('dist/*.svg'):
              s = open(path, encoding='utf-8').read()
              s = re.sub(r'([0-9]*\.?[0-9]+)s\b',
                         lambda m: f"{float(m.group(1))*FACTOR:.3f}s", s)
              open(path, 'w', encoding='utf-8').write(s)
          print("Snake slowed down by factor", FACTOR)
          EOF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
